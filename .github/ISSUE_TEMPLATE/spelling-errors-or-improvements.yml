name: Spelling Errors / Improvements
description: Report a spelling error or suggest improvements to the existing text
labels: ["spelling error / improvement ✏"]
assignees:
  - Regnander
body:
  - type: markdown
    attributes:
      value: Feel free to report what you''ve found in either Swedish or English!
  - type: textarea
    id: existing_text
    attributes:
      label: 🔍 What have you found?
      description: Please provide a description or upload a screenshot to give additional context.
    validations:
      required: true
  - type: textarea
    id: suggested_text
    attributes:
      label: 🩹 How can this be improved?
      description: Please suggest how the text can be improved.
    validations:
      required: true
  - type: markdown
    attributes:
      value: Thank you for helping out! ❤
